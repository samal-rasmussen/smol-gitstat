<section class="graphs-view" x-data="graphsView">
  <style>
    .graphs-view {
      /* Chart heights scale with the viewport: compact on phones, room to
         breathe on wide screens. Chart.js follows the container size. */
      .chart-line,
      .chart-pie {
        position: relative;
        height: clamp(14rem, 8rem + 25vw, 30rem);
      }
      .chart-pie {
        height: clamp(13rem, 6rem + 22vw, 24rem);
      }
      /* From and to are one grid item with an inner two-column grid, so the
         pair always wraps to the next line together. */
      .date-range {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: inherit;
        @media (min-width: 768px) {
          grid-column: span 2;
        }
      }
    }
  </style>
  <h1>Graphs</h1>
  <fieldset class="grid">
    <label>
      Aggregation
      <select x-model="agg" @change="setParam('agg', agg)">
        <option value="commits">Commits</option>
        <option value="additions">Additions</option>
        <option value="deletions">Deletions</option>
        <option value="mutations">Additions + deletions</option>
        <option value="difference">Additions &minus; deletions</option>
      </select>
    </label>
    <label>
      Group by
      <select x-model="by" @change="setParam('by', by)">
        <option value="author">Author</option>
        <option value="project">Project</option>
        <option value="filetype">File type</option>
      </select>
    </label>
    <label>
      Time unit
      <select x-model="unit" @change="setParam('unit', unit)">
        <option value="">Auto</option>
        <option value="day">Day</option>
        <option value="week">Week</option>
        <option value="month">Month</option>
        <option value="year">Year</option>
      </select>
    </label>
    <div class="date-range">
      <label>
        From
        <input type="date" x-model="from" @change="setParam('from', from)" />
      </label>
      <label>
        To
        <input type="date" x-model="to" @change="setParam('to', to)" />
      </label>
    </div>
  </fieldset>
  <p x-show="message !== ''" x-text="message"></p>
  <div x-show="message === ''">
    <div class="chart-line"><canvas x-ref="line"></canvas></div>
    <div class="grid">
      <div class="chart-pie"><canvas x-ref="pie"></canvas></div>
      <div class="overflow-auto">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th class="num">Total</th>
              <th class="num">Average per <span x-text="unitLabel"></span></th>
            </tr>
          </thead>
          <tbody x-ref="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</section>
