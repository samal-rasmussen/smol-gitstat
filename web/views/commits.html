<section class="commits-view" x-data="commitsView">
  <style>
    .commits-view {
      .commit-row {
        cursor: pointer;
      }
      .commit-body {
        white-space: pre-wrap;
      }
      /* When the commit table scrolls sideways the detail row would be as
         wide as the table; pinning its content to the left edge keeps the
         text readable without scrolling back and forth. */
      .commit-detail > td > * {
        position: sticky;
        left: 0;
        max-width: calc(100vw - 2.5rem);
      }
      /* Long hashes and file paths may break anywhere, so the pinned detail
         content never forces a width beyond the viewport. */
      .commit-detail code,
      .commit-detail table td:first-child {
        overflow-wrap: anywhere;
      }
      .dimmed {
        opacity: 0.5;
      }
      .added {
        color: var(--pico-ins-color);
      }
      .removed {
        color: var(--pico-del-color);
      }
      .rename {
        display: block;
        color: var(--pico-muted-color);
      }
      .exclude-commit {
        display: inline-block;
        margin-inline-start: 1rem;
      }
    }
  </style>
  <h1>Commits</h1>
  <fieldset class="grid">
    <label>
      Sort by
      <select x-model="sort" @change="setSort">
        <option value="time">Time</option>
        <option value="additions">Additions</option>
        <option value="deletions">Deletions</option>
        <option value="mutations">Additions + deletions</option>
      </select>
    </label>
    <label>
      Per page
      <select x-model="per" @change="setPer">
        <option value="20">20</option>
        <option value="50">50</option>
        <option value="100">100</option>
      </select>
    </label>
    <label>
      Page <span x-text="page"></span> of <span x-text="pageCount"></span>
      <div role="group">
        <button class="secondary" :disabled="page <= 1" @click="previous">Previous</button>
        <button class="secondary" :disabled="page >= pageCount" @click="next">Next</button>
      </div>
    </label>
  </fieldset>
  <div class="overflow-auto">
    <table>
      <thead>
        <tr>
          <th></th>
          <th>Date</th>
          <th>Author</th>
          <th>Title</th>
          <th class="num">Additions</th>
          <th class="num">Deletions</th>
          <th></th>
        </tr>
      </thead>
      <template x-for="c in rows" :key="c.hash">
        <tbody>
          <tr class="commit-row" :class="c.excluded && 'dimmed'" @click="toggle(c.hash)">
            <td>
              <span
                class="icon icon-chevron-right"
                :class="open[c.hash] && 'rotated'"
                aria-hidden="true"
              ></span>
            </td>
            <td class="nowrap" x-text="dateLabel(c.time)"></td>
            <td class="nowrap" x-text="c.author"></td>
            <td x-text="c.title"></td>
            <td class="added num" x-text="c.additions.toLocaleString()"></td>
            <td class="removed num" x-text="c.deletions.toLocaleString()"></td>
            <td>
              <span class="icon icon-git-merge" x-show="c.isMerge" aria-label="merge commit"></span>
            </td>
          </tr>
          <template x-if="open[c.hash]">
            <tr class="commit-detail">
              <td colspan="7">
                <p>
                  <code x-text="c.hash"></code> &middot; <span x-text="c.project"></span>
                  <label class="exclude-commit">
                    <input
                      type="checkbox"
                      :checked="isExcluded(c.hash)"
                      @change="toggleExclude(c.hash)"
                    />
                    Exclude this commit
                  </label>
                </p>
                <p class="commit-body" x-show="c.body !== ''" x-text="c.body"></p>
                <table x-show="c.files.length > 0">
                  <thead>
                    <tr>
                      <th>File</th>
                      <th class="num">Additions</th>
                      <th class="num">Deletions</th>
                    </tr>
                  </thead>
                  <tbody>
                    <template x-for="f in c.files" :key="f.filepath">
                      <tr :class="f.excluded && 'dimmed'">
                        <td>
                          <span x-text="f.filepath"></span>
                          <template x-if="f.renameOf !== undefined">
                            <small class="rename" x-text="'was ' + f.renameOf"></small>
                          </template>
                        </td>
                        <template x-if="f.isBinary">
                          <td colspan="2">binary</td>
                        </template>
                        <template x-if="!f.isBinary">
                          <td class="added num" x-text="f.additions.toLocaleString()"></td>
                        </template>
                        <template x-if="!f.isBinary">
                          <td class="removed num" x-text="f.deletions.toLocaleString()"></td>
                        </template>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </td>
            </tr>
          </template>
        </tbody>
      </template>
    </table>
  </div>
</section>
