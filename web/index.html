<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>smol-gitstat</title>
    <link rel="icon" href="assets/favicon.svg" />
    <link rel="stylesheet" href="vendor/pico.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <script src="vendor/chart.umd.js" defer></script>
    <script type="module" src="js/app.js"></script>
  </head>
  <body x-data>
    <nav class="container-fluid">
      <ul>
        <li>
          <strong><a href="#/">smol-gitstat</a></strong>
        </li>
      </ul>
      <ul>
        <li>
          <a href="#/graphs" title="Graphs"
            ><span class="icon icon-chart-line" aria-hidden="true"></span>
            <span class="nav-label">Graphs</span></a
          >
        </li>
        <li>
          <a href="#/commits" title="Commits"
            ><span class="icon icon-git-commit-horizontal" aria-hidden="true"></span>
            <span class="nav-label">Commits</span></a
          >
        </li>
        <li>
          <a href="#/config" title="Config"
            ><span class="icon icon-settings" aria-hidden="true"></span>
            <span class="nav-label">Config</span></a
          >
        </li>
        <li>
          <a href="#/about" title="About"
            ><span class="icon icon-info" aria-hidden="true"></span>
            <span class="nav-label">About</span></a
          >
        </li>
        <li class="nav-summary" x-text="$store.app.summary"></li>
      </ul>
    </nav>
    <main class="container-fluid" x-view="$store.router.view"></main>
  </body>
</html>
